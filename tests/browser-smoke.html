<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Smart Auto Refresh Pro Browser Smoke</title>
</head>
<body>
    <p>Browser smoke harness</p>

    <script>
        window.__sarStorage = {};
        window.GM_registerMenuCommand = () => {};
        window.GM_getValue = async (key, fallback) => {
            if (key === 'autoRefreshConfig_v2') {
                return window.__sarStorage[key] || JSON.stringify({
                    version: 2,
                    site: { [location.hostname]: 60 },
                    exact: { [location.href]: 30 },
                    disabled: {}
                });
            }
            return Object.prototype.hasOwnProperty.call(window.__sarStorage, key)
                ? window.__sarStorage[key]
                : fallback;
        };
        window.GM_setValue = async (key, value) => {
            window.__sarStorage[key] = value;
        };
        window.alert = () => {};
    </script>

    <script src="../smart-auto-refresh-pro.user.js"></script>

    <script>
        const fail = (error) => {
            document.body.dataset.smokeResult = 'FAIL';
            document.body.dataset.smokeError = error instanceof Error ? error.message : String(error);
        };
        const assert = (condition, message) => {
            if (!condition) throw new Error(message);
        };
        const near = (a, b, tolerance = 2) => Math.abs(a - b) <= tolerance;

        setTimeout(() => {
            try {
                const host = document.querySelector('#autoRefreshProPanel');
                assert(host, 'control panel host was not created');
                const root = host.shadowRoot || host;
                const panel = root.querySelector('#sarControlPanel');
                const badge = root.querySelector('.sar-badge');
                const countdown = root.querySelector('#countdown');

                assert(panel?.dataset.mode === 'expanded', `initial panel mode mismatch: ${panel?.dataset.mode}`);
                assert(badge?.textContent.trim() === '精准网址', 'exact-scope badge mismatch');
                assert(countdown?.textContent.trim() === '00:00:30', `countdown mismatch: ${countdown?.textContent}`);
                assert(host.style.zIndex === '2147483647', 'panel z-index mismatch');
                document.body.dataset.smokePanel = 'PASS';
            } catch (error) {
                fail(error);
            }
        }, 50);

        setTimeout(() => {
            if (document.body.dataset.smokeResult === 'FAIL') return;
            try {
                const host = document.querySelector('#autoRefreshProPanel');
                const root = host.shadowRoot || host;
                const panel = root.querySelector('#sarControlPanel');
                const mini = root.querySelector('#sarMiniButton');

                assert(panel.dataset.mode === 'mini', `idle panel did not collapse: ${panel.dataset.mode}`);
                assert(mini && getComputedStyle(mini).display !== 'none', 'mini timer is not visible');

                mini.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
                assert(panel.dataset.mode === 'mini', 'mini timer expanded merely from hover');
                document.body.dataset.smokeMiniHover = 'PASS';

                mini.setPointerCapture = () => {};
                mini.releasePointerCapture = () => {};
                const rect = mini.getBoundingClientRect();
                const pointerId = 77;
                const startX = rect.left + rect.width / 2;
                const startY = rect.top + rect.height / 2;
                mini.dispatchEvent(new PointerEvent('pointerdown', {
                    bubbles: true, pointerId, pointerType: 'mouse', button: 0,
                    clientX: startX, clientY: startY
                }));
                mini.dispatchEvent(new PointerEvent('pointermove', {
                    bubbles: true, pointerId, pointerType: 'mouse', buttons: 1,
                    clientX: startX + 100, clientY: startY
                }));
                mini.dispatchEvent(new PointerEvent('pointerup', {
                    bubbles: true, pointerId, pointerType: 'mouse', button: 0,
                    clientX: startX + 100, clientY: startY
                }));

                assert(panel.dataset.mode === 'mini', 'mini timer expanded after drag');
                assert(near(host.getBoundingClientRect().right, window.innerWidth),
                    `mini timer did not reach right edge: ${host.getBoundingClientRect().right}/${window.innerWidth}`);
                document.body.dataset.smokeMiniDrag = 'PASS';

                mini.click();
                assert(panel.dataset.mode === 'expanded', 'mini timer did not expand after click');
                assert(near(host.getBoundingClientRect().right, window.innerWidth),
                    'expanded panel did not preserve right-edge anchor');
                document.body.dataset.smokeExpandAnchor = 'PASS';

                root.querySelector('#setBtn')?.click();
            } catch (error) {
                fail(error);
            }
        }, 5300);

        setTimeout(() => {
            if (document.body.dataset.smokeResult === 'FAIL') return;
            try {
                const host = document.querySelector('#autoRefreshProPanel');
                const root = host.shadowRoot || host;
                const backdrop = root.querySelector('#sarSettingsBackdrop');
                const intervalInput = backdrop?.querySelector('#sarIntervalInput');
                const increase = backdrop?.querySelector('#sarIntervalIncrease');
                const decrease = backdrop?.querySelector('#sarIntervalDecrease');
                const stepper = backdrop?.querySelector('#sarIntervalStepper');
                const exactRadio = backdrop?.querySelector('input[name="sarScope"][value="exact"]');
                const siteRadio = backdrop?.querySelector('input[name="sarScope"][value="site"]');
                const overrideChoice = backdrop?.querySelector('#sarOverrideChoice');
                const removeOverride = backdrop?.querySelector('input[name="sarOverride"][value="remove"]');
                const saveButton = backdrop?.querySelector('#sarSaveBtn');
                const message = backdrop?.querySelector('#sarDialogMessage');
                const scopeTitles = [...(backdrop?.querySelectorAll('.sar-radio-title strong') || [])].map((el) => el.textContent.trim());
                const currentUrl = backdrop?.querySelector('#sarCurrentUrl');
                const currentHost = backdrop?.querySelector('#sarCurrentHost');

                assert(backdrop, 'settings dialog did not open');
                assert(intervalInput?.value === '30', `settings interval mismatch: ${intervalInput?.value}`);
                assert(scopeTitles.includes('仅当前页面') && scopeTitles.includes('整个网站'),
                    `scope titles mismatch: ${scopeTitles.join(',')}`);
                assert(currentUrl?.textContent === location.href, 'current URL context missing');
                assert(currentHost?.textContent === location.hostname, 'current host context missing');

                increase.click();
                assert(intervalInput.value === '31', `stepper + click failed: ${intervalInput.value}`);
                intervalInput.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, key: 'ArrowUp' }));
                assert(intervalInput.value === '32', `ArrowUp failed: ${intervalInput.value}`);
                intervalInput.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, key: 'ArrowUp', shiftKey: true }));
                assert(intervalInput.value === '42', `Shift+ArrowUp failed: ${intervalInput.value}`);
                stepper.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: -100 }));
                assert(intervalInput.value === '43', `wheel increment failed: ${intervalInput.value}`);
                intervalInput.value = '1';
                decrease.click();
                assert(intervalInput.value === '1', `minimum clamp failed: ${intervalInput.value}`);
                document.body.dataset.smokeStepper = 'PASS';

                intervalInput.value = '30';
                intervalInput.dispatchEvent(new Event('input', { bubbles: true }));
                assert(exactRadio.checked, 'exact scope should be initially selected');
                siteRadio.checked = true;
                siteRadio.dispatchEvent(new Event('change', { bubbles: true }));
                assert(!overrideChoice.hidden, 'exact override choice did not appear for site scope');
                assert(removeOverride.checked, 'site-scope takeover is not the default conflict decision');
                assert(overrideChoice.textContent.includes('使用网站规则（推荐）'), 'recommended site takeover copy missing');
                document.body.dataset.smokeScope = 'PASS';

                intervalInput.value = '3';
                intervalInput.dispatchEvent(new Event('input', { bubbles: true }));
                saveButton.click();
                assert(!message.hidden && message.dataset.kind === 'warning', 'high-frequency inline confirmation missing');
                assert(saveButton.textContent.trim() === '确认高频并保存', 'high-frequency confirmation state missing');

                backdrop.querySelector('#sarDeleteSiteBtn')?.click();
                const actionConfirm = backdrop.querySelector('#sarActionConfirm');
                assert(actionConfirm && !actionConfirm.hidden, 'destructive action confirmation missing');

                document.body.dataset.smokeDialog = 'PASS';
                document.body.dataset.smokeResult = 'PASS';
            } catch (error) {
                fail(error);
            }
        }, 5500);
    </script>
</body>
</html>
